# SPDX-License-Identifier: MPL-2.0
# Quelle: F13 core v3.0.0 (apisix-guest.yaml), angepasst für f13-demo:
#   - transcription und tusd entfernt (in der Demo nicht installiert)
# Gemountet nach /usr/local/apisix/conf/apisix-guest.yaml.
# WICHTIG: Die Datei muss mit der Zeile "#END" enden, sonst lädt APISIX sie nicht.

global_rules:
  - id: cors
    plugins:
      cors:
        allow_origins: "${{CORS_ALLOW_ORIGINS:=http://localhost:9999}}"
        allow_methods: "*"
        allow_headers: "*"

upstreams:
  - id: rag
    type: roundrobin
    nodes:
      "rag:8000": 1

services:
  - id: healthcheck
    plugins:
      response-rewrite:
        status_code: 200
        body: '{"status":"F13-Core is running"}'
        headers:
          set:
            Content-Type: application/json

  - id: frontend
    enable_websocket: true
    upstream:
      type: roundrobin
      nodes:
        "frontend:9999": 1

  - id: feedback
    upstream:
      type: roundrobin
      nodes:
        "feedback:8000": 1
    plugins:
      proxy-rewrite:
        regex_uri: ["^/feedback/(.*)$", "/$1"]

  - id: chat
    upstream:
      type: roundrobin
      nodes:
        "chat:8000": 1
    plugins:
      proxy-rewrite:
        regex_uri: ["^/chat/(.*)$", "/$1"]

  - id: summary
    upstream:
      type: roundrobin
      nodes:
        "summary:8000": 1

  - id: rag
    upstream_id: rag
    plugins:
      proxy-rewrite:
        regex_uri: ["^/rag/(.*)$", "/$1"]

  - id: rag-database
    upstream_id: rag
    plugins:
      proxy-rewrite:
        regex_uri: ["^/rag/(.*)$", "/$1"]

  - id: rag-file
    upstream_id: rag
    plugins:
      proxy-rewrite:
        regex_uri: ["^/rag/(.*)$", "/$1"]

routes:
  # --- Chat ---
  - id: chat-completion
    uri: /chat/completion
    service_id: chat
  - id: chat-completion-stream
    uri: /chat/completion/stream
    service_id: chat
  - id: chat-v2-completion-stream
    uri: /chat/v2/completion/stream
    service_id: chat
  - id: chat-experimental-agentic-completion-stream
    uri: /chat/experimental/agentic/completion/stream
    service_id: chat
  - id: chat-llms
    uri: /chat/llms
    service_id: chat

  # --- RAG ---
  - id: rag-file
    uri: /rag/file
    service_id: rag-file
  - id: rag-db-sources
    uri: /rag/sources
    service_id: rag-database
  - id: rag-db
    uri: /rag/database
    service_id: rag-database
  - id: rag-llms
    uri: /rag/llms
    service_id: rag

  # --- Summary ---
  - id: summary-llms
    uri: /summary/llms
    service_id: summary
    plugins:
      proxy-rewrite:
        regex_uri: ["^/summary/(.*)$", "/$1"]
  - id: summary-file
    uri: /summary/file
    service_id: summary
  - id: summary-text
    uri: /summary/text
    service_id: summary

  # --- Feedback ---
  - id: feedback-general
    uri: /feedback/general
    service_id: feedback
  - id: feedback-summary
    uri: /feedback/summary
    service_id: feedback
  - id: feedback-rag
    uri: /feedback/rag
    service_id: feedback
  - id: feedback-chat
    uri: /feedback/chat
    service_id: feedback

  # --- Healthcheck ---
  - id: root-healthcheck
    uri: /
    service_id: healthcheck
  - id: healthcheck
    uri: /health
    service_id: healthcheck

  # transcription und tusd: entfernt, weil nicht installiert.
#END
