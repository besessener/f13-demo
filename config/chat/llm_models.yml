# Chat-Dienst: Sprachmodelle (f13-demo).
# Gemountet nach /chat/configs/llm_models.yml.
#
# Modellwechsel: nur in .env (LLM_MODELL, EMBEDDING_MODELL). "f13-sprachmodell" und
# "f13-embedding" sind feste Namen, die werkzeuge/modelle_laden.py beim Start anlegt.
#
# Prompts verwenden Python str.format: Die einzige erlaubte geschweifte Klammer
# ist {current_date}.
chat:
  llama_lokal:
    label: "Lokales Sprachmodell"
    model: "f13-sprachmodell"
    prompt_map: base_assistant
    is_remote: false
    # Gesamtfenster (Eingabe + Ausgabe). Muss <= OLLAMA_CONTEXT_LENGTH (4096) sein.
    context_length: 4096
    api:
      url: http://ollama:11434/v1
      # CPU-Inferenz ist langsam, daher großzügig (Sekunden).
      timeout: 600
      health_check: /models
    inference:
      temperature: 0.3
      top_p: 0.9
      max_new_tokens: 1024
