# =============================================================================
# f13-demo – kompletter F13-Demo-Stack, vollständig lokal (Windows + Rancher Desktop)
# =============================================================================
# Alle Befehle in PowerShell im Repo-Ordner ausführen:
#
#   start.cmd (Doppelklick)                    Alles starten, prüfen, vorwärmen, Browser öffnen
#   docker compose up -d --wait                Starten (baut beim ersten Mal das Frontend und
#                                              lädt die Modelle; danach geht es offline)
#   docker compose ps                          Status und Health aller Dienste
#   docker compose run --rm warmup             Modelle vor der Vorführung vorladen
#   docker compose run --rm pruefen            Alle Dienste prüfen (✔/✘)
#   docker compose run --rm testfragen         Gegenprobe: Testfragen ohne RAG stellen
#   docker compose run --rm versionen          Verfügbare F13-Image-Tags anzeigen (Internet)
#   docker compose run --rm smoke-test         Echte Anfragen an Chat, Summary und RAG
#   docker compose run --rm api-doku           API-Beschreibungen nach ausgabe/openapi/
#   docker compose run --rm modellvergleich    Sprachmodelle vergleichen (Tempo, RAM, Antworten)
#   docker compose run --rm vorfuehrung        Die ganze Vorführung im Terminal (Rückfallebene)
#   docker compose logs -f chat                Logs eines Dienstes ansehen
#   docker compose down                        Stoppen – OHNE -v, sonst sind die Modelle weg
#
# Hinter einem Firmen-Proxy mit HTTPS-Prüfung legt start.cmd das Firmenzertifikat in
# config/zertifikate/ ab (siehe dort README.md).
#
# Danach im Browser: http://localhost:9999 (Frontend), http://localhost:8000/health (Core)
#
# Versionen, Ports und Modellnamen stehen in .env.
# Netzwerk wird nur bei der Einrichtung gebraucht (Images, Modelle, Frontend-Build).
# =============================================================================

name: f13-demo

# --- Gemeinsame Bausteine -----------------------------------------------------

x-dienst: &dienst
  restart: unless-stopped

# Die F13-Images gibt es nur für amd64.
x-f13-dienst: &f13-dienst
  <<: *dienst
  platform: linux/amd64
  # ANNAHME (ungeprüft): Die F13-Python-Images enthalten "python" und lauschen auf 8000.
  # Geprüft wird nur, ob der Port offen ist (der Health-Endpunkt ist unbekannt).
  healthcheck:
    test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 3)"]
    interval: 15s
    timeout: 5s
    retries: 5
    start_period: 60s

# Stammzertifikate für HTTPS-Downloads aus den Containern: öffentliche plus die aus
# config/zertifikate/ (Firmen-Proxy). Erzeugt vom Einmal-Container "zertifikate".
x-zertifikate-umgebung: &zertifikate-umgebung
  SSL_CERT_FILE: /zertifikate/ca-bundle.pem
  REQUESTS_CA_BUNDLE: /zertifikate/ca-bundle.pem

x-werkzeug-umgebung: &werkzeug-umgebung
  PYTHONUNBUFFERED: "1"
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONIOENCODING: "utf-8"
  OLLAMA_URL: http://ollama:11434
  LLM_MODELL: ${LLM_MODELL}
  EMBEDDING_MODELL: ${EMBEDDING_MODELL}
  LLM_MAX_TOKENS: ${LLM_MAX_TOKENS}
  # Feste Namen, unter denen F13 die Modelle anspricht (siehe werkzeuge/modelle_laden.py).
  SPRACHMODELL: f13-sprachmodell
  EMBEDDING: f13-embedding

# Hilfsaufgaben: starten NICHT mit "up", nur mit "docker compose run --rm <name>".
x-werkzeug: &werkzeug
  image: python:${WERKZEUG_PYTHON_VERSION}
  profiles: ["werkzeuge"]
  restart: "no"
  mem_limit: 128m
  working_dir: /werkzeuge
  volumes:
    - ./werkzeuge:/werkzeuge:ro
  environment:
    <<: *werkzeug-umgebung

services:

  # --- Sprachmodelle ----------------------------------------------------------
  # Nicht zum Rechner veröffentlicht; nur im Compose-Netz unter ollama:11434.
  ollama:
    <<: *dienst
    image: ollama/ollama:${OLLAMA_VERSION}
    mem_limit: 3500m
    environment:
      <<: *zertifikate-umgebung
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
      OLLAMA_FLASH_ATTENTION: "1"
      OLLAMA_KV_CACHE_TYPE: q8_0
      OLLAMA_MAX_LOADED_MODELS: "2"
      OLLAMA_KEEP_ALIVE: "-1"
    volumes:
      - ollama-modelle:/root/.ollama
      - zertifikate:/zertifikate:ro
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      zertifikate:
        condition: service_completed_successfully

  # --- Oberfläche -------------------------------------------------------------
  # Es gibt kein fertiges Image: Es wird beim ersten "docker compose up -d" direkt aus
  # dem Git-Tag gebaut (braucht Internet). Danach liegt es lokal als
  # f13-demo/frontend:<Version> vor und wird nie aus einer Registry gezogen.
  # Neu bauen, z. B. nach Versionswechsel: docker compose build frontend
  frontend:
    <<: *dienst
    image: f13-demo/frontend:${F13_FRONTEND_VERSION}
    pull_policy: never
    build:
      # F13 v3 nutzt das Svelte-Frontend aus dem Repo "frontend" (Tag v3.0.1). Das neuere
      # Repo "f13-frontend" (React, Tags app-v*) gehört zu einer anderen F13-Generation.
      context: https://gitlab.opencode.de/f13/microservices/frontend.git#${F13_FRONTEND_VERSION}
    mem_limit: 200m
    environment:
      KEYCLOAK_DISABLED: "true"
      # Muss vom BROWSER aus erreichbar sein, daher localhost statt "core".
      # ANNAHME (ungeprüft): Das Frontend liest API_URL beim Start, nicht beim Bauen.
      API_URL: http://localhost:${CORE_PORT}
    # Nur auf 127.0.0.1, damit die Demo im Büronetz nicht sichtbar ist.
    # Falls http://localhost:9999 unter Windows nicht erreichbar ist: "127.0.0.1:" entfernen.
    ports:
      - "127.0.0.1:${FRONTEND_PORT}:9999"
    # Das Image bringt einen eigenen Healthcheck mit.
    depends_on:
      reranker:
        condition: service_healthy

  # --- API-Gateway (F13-Core = APISIX ohne etcd) ------------------------------
  core:
    <<: *dienst
    image: apache/apisix:${APISIX_VERSION}
    mem_limit: 256m
    environment:
      APISIX_STAND_ALONE: "true"
      APISIX_PROFILE: guest
      CORS_ALLOW_ORIGINS: http://localhost:${FRONTEND_PORT}
    volumes:
      # Die Datei wird zusätzlich als config.yaml gemountet: Mit APISIX_STAND_ALONE=true
      # prüft das Start-Skript des Images (3.15), ob config.yaml "role: data_plane"
      # enthält. Die mitgelieferte config.yaml (etcd) würde den Start abbrechen.
      # (Lokal mit apache/apisix:3.15.0-ubuntu getestet.)
      - ./config/core/config-guest.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./config/core/config-guest.yaml:/usr/local/apisix/conf/config-guest.yaml:ro
      - ./config/core/apisix-guest.yaml:/usr/local/apisix/conf/apisix-guest.yaml:ro
    ports:
      - "127.0.0.1:${CORE_PORT}:8000"
    healthcheck:
      # Im Ubuntu-Image gibt es bash; /dev/tcp spart curl.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /health HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      frontend:
        condition: service_started
      chat:
        condition: service_started
      summary:
        condition: service_started
      rag:
        condition: service_started
      feedback:
        condition: service_started

  # --- Chat -------------------------------------------------------------------
  # Einzelne Dateien mounten, damit die eingebaute prompt_maps.yml erhalten bleibt.
  chat:
    <<: *f13-dienst
    image: registry.opencode.de/f13/microservices/chat:${F13_CHAT_VERSION}
    mem_limit: 500m
    volumes:
      - ./config/chat/general.yml:/chat/configs/general.yml:ro
      - ./config/chat/llm_models.yml:/chat/configs/llm_models.yml:ro
      - ./config/chat/agentic_chat.yml:/chat/configs/agentic_chat.yml:ro
    depends_on:
      opa:
        condition: service_healthy
      modelle-laden:
        condition: service_completed_successfully

  # --- Richtlinien für Chat-Werkzeuge (Chat startet nicht ohne OPA) ------------
  opa:
    <<: *dienst
    image: openpolicyagent/opa:${OPA_VERSION}
    mem_limit: 128m
    command: ["run", "--server", "--addr=:8181", "--watch", "--set=decision_logs.console=true", "/policies"]
    volumes:
      - ./config/opa/policies:/policies:ro
    healthcheck:
      test: ["CMD", "/opa", "eval", "1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

  # --- Feedback ---------------------------------------------------------------
  feedback:
    <<: *f13-dienst
    image: registry.opencode.de/f13/microservices/feedback:${F13_FEEDBACK_VERSION}
    mem_limit: 256m
    volumes:
      - ./config/f13/general.yml:/feedback/configs/general.yml:ro
      - ./config/secrets/feedback_db.secret:/core/secrets/feedback_db.secret:ro
    depends_on:
      feedback-db:
        condition: service_healthy

  # Das Passwort in config/secrets/feedback_db.secret ist absichtlich eingecheckt.
  # Das ist nur vertretbar, weil diese Datenbank NIE zum Rechner veröffentlicht wird
  # (kein "ports:") und nur Demo-Daten enthält.
  feedback-db:
    <<: *dienst
    image: postgres:${POSTGRES_VERSION}
    mem_limit: 256m
    environment:
      POSTGRES_DB: feedback
      POSTGRES_USER: member
      POSTGRES_PASSWORD_FILE: /run/secrets/feedback_db.secret
    volumes:
      - ./config/secrets/feedback_db.secret:/run/secrets/feedback_db.secret:ro
      # Ab Postgres 18 liegt das Datenverzeichnis unterhalb von /var/lib/postgresql.
      - feedback-db-daten:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "member", "-d", "feedback"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- Zusammenfassung --------------------------------------------------------
  # Image-Pfade, Tags und Konfigurationspfad /<dienst>/configs/ von summary, rag und
  # parser sind in der CI bestätigt (docs/VERIFIZIEREN.md). Tags prüfen mit:
  # docker compose run --rm versionen
  summary:
    <<: *f13-dienst
    image: registry.opencode.de/f13/microservices/summary:${F13_SUMMARY_VERSION}
    mem_limit: 500m
    volumes:
      - ./config/f13/general.yml:/summary/configs/general.yml:ro
      - ./config/f13/llm_models.yml:/summary/configs/llm_models.yml:ro
    depends_on:
      modelle-laden:
        condition: service_completed_successfully
      parser:
        condition: service_started

  # --- Dokumente einlesen (PDF -> Text) ---------------------------------------
  # Lädt beim ersten Start seine PDF-Modelle (docling) von huggingface.co und öffnet erst
  # danach Port 8000. Das Volume parser-modelle hebt sie auf, damit spätere Starts auch
  # offline funktionieren.
  parser:
    <<: *f13-dienst
    image: registry.opencode.de/f13/microservices/parser:${F13_PARSER_VERSION}
    mem_limit: 900m
    environment:
      <<: *zertifikate-umgebung
    volumes:
      - ./config/f13/general.yml:/parser/configs/general.yml:ro
      - ./config/f13/llm_models.yml:/parser/configs/llm_models.yml:ro
      - parser-modelle:/parser/src/docling-models
      - zertifikate:/zertifikate:ro
    # Wie x-f13-dienst, aber mit 15 Minuten Anlaufzeit für den ersten Modell-Download
    # (auf langsamen Leitungen mehrere Minuten; die CI braucht ca. 10 s).
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8000), 3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 900s
      start_interval: 5s
    depends_on:
      zertifikate:
        condition: service_completed_successfully

  # --- Recherche (RAG) --------------------------------------------------------
  rag:
    <<: *f13-dienst
    image: registry.opencode.de/f13/microservices/rag:${F13_RAG_VERSION}
    mem_limit: 900m
    volumes:
      - ./config/f13/general.yml:/rag/configs/general.yml:ro
      - ./config/f13/llm_models.yml:/rag/configs/llm_models.yml:ro
    depends_on:
      modelle-laden:
        condition: service_completed_successfully
      elasticsearch:
        condition: service_healthy
      reranker:
        condition: service_healthy
      parser:
        condition: service_started

  # --- Stichwort-Reranker für RAG ----------------------------------------------
  # Der RAG-Dienst verlangt einen Reranker (Cohere-Schnittstelle). Statt eines weiteren
  # Modells (ca. 1 GB RAM) sortiert werkzeuge/reranker.py die Treffer nach Stichwörtern.
  reranker:
    <<: *dienst
    image: python:${WERKZEUG_PYTHON_VERSION}
    mem_limit: 64m
    command: ["python", "/werkzeuge/reranker.py"]
    volumes:
      - ./werkzeuge:/werkzeuge:ro
    environment:
      PYTHONUNBUFFERED: "1"
    networks:
      default:
        # Das Frontend-nginx erwartet beim Start einen Host "tusd" (Upload-Dienst der
        # Transkription, in der Demo nicht installiert). Ohne auflösbaren Namen startet
        # nginx nicht. Der Alias erfüllt nur diese Startbedingung.
        aliases: [tusd]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7997/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # --- Vektor-Datenbank für RAG -----------------------------------------------
  elasticsearch:
    <<: *dienst
    image: elasticsearch:${ELASTICSEARCH_VERSION}
    mem_limit: 1200m
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      # Spart RAM: kein Machine-Learning-Prozess.
      xpack.ml.enabled: "false"
      # Auf vollen Laptop-Platten sonst schreibgeschützt.
      cluster.routing.allocation.disk.threshold_enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - es-daten:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # --- Einmal-Container beim Start -------------------------------------------
  # Läuft bei jedem "up" vor parser und ollama. Schreibt die Stammzertifikate (öffentliche
  # plus config/zertifikate/) ins Volume "zertifikate" (siehe werkzeuge/zertifikate.py).
  zertifikate:
    <<: *werkzeug
    profiles: []
    command: ["python", "/werkzeuge/zertifikate.py"]
    volumes:
      - ./werkzeuge:/werkzeuge:ro
      - ./config/zertifikate:/eigene:ro
      - zertifikate:/zertifikate

  # Läuft bei jedem "up" kurz vor chat, summary und rag. Lädt nur fehlende Modelle,
  # deshalb funktioniert der Start offline, sobald die Modelle einmal da sind.
  modelle-laden:
    <<: *werkzeug
    profiles: []
    command: ["python", "/werkzeuge/modelle_laden.py"]
    depends_on:
      ollama:
        condition: service_healthy

  # --- Hilfsaufgaben (Profil "werkzeuge") -------------------------------------

  warmup:
    <<: *werkzeug
    command: ["python", "/werkzeuge/warmup.py"]
    depends_on:
      ollama:
        condition: service_healthy

  # Startet absichtlich nichts selbst, sondern prüft den laufenden Stack.
  pruefen:
    <<: *werkzeug
    command: ["python", "/werkzeuge/pruefen.py"]
    environment:
      <<: *werkzeug-umgebung
      ELASTICSEARCH_URL: http://elasticsearch:9200
      CORE_URL: http://core:8000
      FRONTEND_URL: http://frontend:9999

  # Braucht Internet (GitLab-API von opencode.de).
  versionen:
    <<: *werkzeug
    command: ["python", "/werkzeuge/versionen.py"]
    volumes:
      - ./werkzeuge:/werkzeuge:ro
      - zertifikate:/zertifikate:ro
    depends_on:
      zertifikate:
        condition: service_completed_successfully
    environment:
      <<: [*werkzeug-umgebung, *zertifikate-umgebung]
      F13_FRONTEND_VERSION: ${F13_FRONTEND_VERSION}
      F13_CHAT_VERSION: ${F13_CHAT_VERSION}
      F13_FEEDBACK_VERSION: ${F13_FEEDBACK_VERSION}
      F13_SUMMARY_VERSION: ${F13_SUMMARY_VERSION}
      F13_RAG_VERSION: ${F13_RAG_VERSION}
      F13_PARSER_VERSION: ${F13_PARSER_VERSION}

  testfragen:
    <<: *werkzeug
    command: ["python", "/werkzeuge/testfragen.py"]
    volumes:
      - ./werkzeuge:/werkzeuge:ro
      - ./demo-data:/demo-data:ro
    environment:
      <<: *werkzeug-umgebung
      TESTFRAGEN_DATEI: /demo-data/rag/testfragen.md
    depends_on:
      ollama:
        condition: service_healthy

  # Echte Anfragen an Chat, Summary und RAG (über Core).
  smoke-test:
    <<: *werkzeug
    command: ["python", "/werkzeuge/smoke_test.py"]
    volumes:
      - ./werkzeuge:/werkzeuge:ro
      - ./demo-data:/demo-data:ro
    environment:
      <<: *werkzeug-umgebung
      CORE_URL: http://core:8000

  # Vorführung im Terminal: Chat, Zusammenfassung, Recherche über die echte F13-API.
  # Andere Testfragen: docker compose run --rm -e FRAGEN=1,3,6 vorfuehrung
  vorfuehrung:
    <<: *werkzeug
    command: ["python", "/werkzeuge/vorfuehrung.py"]
    volumes:
      - ./werkzeuge:/werkzeuge:ro
      - ./demo-data:/demo-data:ro
    environment:
      <<: *werkzeug-umgebung
      CORE_URL: http://core:8000

  # Vergleicht Sprachmodelle (Tempo, RAM, Antworten) -> ausgabe/modellvergleich.md
  # Andere Modelle: docker compose run --rm -e MODELLE="a:1b,b:2b" modellvergleich
  modellvergleich:
    <<: *werkzeug
    command: ["python", "/werkzeuge/modellvergleich.py"]
    volumes:
      - ./werkzeuge:/werkzeuge:ro
      - ./demo-data:/demo-data:ro
      - ./ausgabe:/ausgabe
    depends_on:
      ollama:
        condition: service_healthy

  # Schreibt die OpenAPI-Beschreibungen der F13-Dienste nach ./ausgabe/openapi/.
  api-doku:
    <<: *werkzeug
    command: ["python", "/werkzeuge/api_doku.py"]
    volumes:
      - ./werkzeuge:/werkzeuge:ro
      - ./ausgabe:/ausgabe

volumes:
  ollama-modelle:
  parser-modelle:
  zertifikate:
  es-daten:
  feedback-db-daten:
